name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: npm

      - name: Tag matches package.json version
        run: |
          want="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version ($want)"; exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run package

      - name: Release notes from this version's CHANGELOG section
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 == "## " v {on=1; next} on && /^## / {exit} on' CHANGELOG.md \
            | sed -e '/./,$!d' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## $v' section"; exit 1
          fi
          cat release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/mcp.js "seedpod-mcp-${GITHUB_REF_NAME}.js"
          gh release create "$GITHUB_REF_NAME" \
            --title "Seedpod $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            ./*.vsix "seedpod-mcp-${GITHUB_REF_NAME}.js"
